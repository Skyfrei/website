<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>:: guestbook :: skyfrei</title>
  <style>
    :root {
  --bg-deep: #000000;
  --text-main: #b8c0cc;
  --text-dim: #636e7b;
  --text-bright: #ffffff;
  --link-blue: #7094b7;
  --chevron-cyan: #72a9c4;
  --box-bg: #040609;
  --border-dark: #1b232c;
  --font-mono: ui-monospace, "SF Mono", "Fira Code", "Courier New", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background-color: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  padding: 2.5rem 1rem 3rem;
  -webkit-font-smoothing: antialiased;
}

.page-container {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  align-items: stretch;
  gap: 24px;
}

.content-col {
  flex: 1 1 0;
  min-width: 0;
  padding-right: 12px;
}

.doc-header {
  margin-bottom: 2rem;
}

.page-title {
  font-size: 1.35rem;
  font-weight: bold;
  font-style: italic;
  color: var(--text-bright);
  margin-bottom: 0.35rem;
}

.subtitle {
  color: var(--text-dim);
  font-size: 12px;
}

.doc-section {
  margin-bottom: 2.5rem;
}

.section-heading {
  font-size: 1.05rem;
  font-style: italic;
  font-weight: bold;
  color: var(--text-bright);
  margin-bottom: 0.85rem;
  letter-spacing: -0.01em;
}

.chevron {
  color: var(--chevron-cyan);
  font-style: normal;
  margin-right: 4px;
}

/* ================= SIGN FORM ================= */
.sign-box {
  background-color: var(--box-bg);
  border: 1px solid #161e27;
  box-shadow: inset 1px 1px 0 #2a3543, inset -1px -1px 0 #070a0e;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 580px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-label {
  color: var(--text-dim);
  font-size: 11px;
}

.hud-input,
.hud-textarea {
  background-color: #020305;
  border: 1px solid #1f2733;
  color: #dbe2ea;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 8px;
  outline: none;
  box-shadow: inset 1px 1px 2px #000;
}

.hud-input:focus,
.hud-textarea:focus {
  border-color: #485c73;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.hud-submit-btn {
  background: linear-gradient(180deg, #1c2633 0%, #0d1217 100%);
  border: 1px solid #333d4b;
  box-shadow: inset 1px 1px 0 #596b82, inset -1px -1px 0 #000;
  color: #dbe2ea;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: bold;
  font-style: italic;
  padding: 4px 18px;
  cursor: pointer;
}

.hud-submit-btn:hover {
  background: linear-gradient(180deg, #273444 0%, #151d26 100%);
  color: #fff;
}

.form-status {
  color: var(--text-dim);
  font-size: 11px;
}

/* ================= ENTRIES STREAM ================= */
.entries-stream {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 580px;
}

.entry-row {
  background-color: var(--box-bg);
  border: 1px solid #141b24;
  box-shadow: inset 1px 1px 0 #202b38, inset -1px -1px 0 #05070a;
  padding: 8px 12px;
}

.entry-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid #10161f;
  padding-bottom: 4px;
  margin-bottom: 6px;
}

.entry-author {
  color: var(--text-dim);
  font-size: 11.5px;
}

.entry-date {
  color: #4b5563;
  font-size: 11px;
}

.entry-msg {
  color: #cad3df;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ================= SPINE & HUD ================= */
.metallic-spine {
  width: 16px;
  flex-shrink: 0;
  background: linear-gradient(90deg, 
    transparent 0%, 
    #0d131a 20%, 
    #405063 45%, 
    #7b8fa3 50%, 
    #1e2530 55%, 
    #090d12 80%, 
    transparent 100%
  );
  box-shadow: -1px 0 0 #000, 1px 0 0 #000;
  opacity: 0.85;
}

.sidebar-col {
  width: 220px;
  flex-shrink: 0;
}

.sticky-hud-frame {
  position: sticky;
  top: 2rem;
  background-color: #040608;
  border: 2px solid #1c222b;
  box-shadow: 
    0 0 0 1px #3c4856,
    inset 0 0 0 1px #4e5a6a,
    inset 2px 2px 0 #78889b,
    inset -2px -2px 0 #0a0d11;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hud-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 4px 6px;
  border-bottom: 2px groove #232a35;
}

.title-badge {
  font-size: 1.15rem;
  font-style: italic;
  font-weight: bold;
  color: #ffffff;
  padding: 2px 10px;
  background: linear-gradient(180deg, #182029 0%, #080b0f 100%);
  border: 1px solid #4a5768;
  box-shadow: inset 1px 1px 0 #8fa4be, inset -1px -1px 0 #000;
  text-shadow: 0 0 4px rgba(255,255,255,0.3);
}

.hud-glyph {
  color: #617387;
  font-size: 14px;
}

.hud-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hud-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 12px;
  color: #dbe2ea;
  text-decoration: none;
  font-size: 12.5px;
  font-weight: bold;
  font-style: italic;
  background: linear-gradient(180deg, #1a222c 0%, #0d1217 60%, #05070a 100%);
  border: 1px solid #333d4b;
  box-shadow: inset 1px 1px 0 #596b82, inset -1px -1px 0 #000, 1px 1px 2px rgba(0,0,0,0.8);
}

.hud-btn .arrow {
  color: #556272;
  font-size: 10px;
}

.hud-btn.active {
  background: linear-gradient(180deg, #273444 0%, #151d26 100%);
  color: #fff;
  border-color: #6a829e;
  box-shadow: inset 1px 1px 0 #95adc7, inset -1px -1px 0 #000;
}

.hud-btn:hover:not(.active) {
  background: linear-gradient(180deg, #222d3b 0%, #121921 100%);
  color: #fff;
}

.sidebar-artbox {
  height: 280px;
  background: radial-gradient(circle at center, #0f1c29 0%, #030508 70%);
  border: 1px solid #1e2632;
  box-shadow: inset 0 0 15px #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.art-inner {
  width: 100%;
  height: 100%;
  background-image: 
    radial-gradient(ellipse at 50% 50%, rgba(114, 169, 196, 0.3) 0%, transparent 65%),
    linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.08) 50%, transparent 52%),
    linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.08) 50%, transparent 52%);
  background-size: 100% 100%, 25px 25px, 25px 25px;
  filter: contrast(140%) brightness(85%);
}

.hud-footer-bar {
  max-width: 1040px;
  margin: 3rem auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, #141b24 0%, #080b0f 100%);
  border: 1px solid #2c3644;
  box-shadow: inset 1px 1px 0 #526377, inset -1px -1px 0 #000;
  padding: 4px 10px;
  font-size: 11px;
  color: #798696;
}

.footer-dots {
  letter-spacing: 0.1em;
  color: #4b5868;
}

.footer-info {
  text-align: center;
  flex-grow: 1;
}

.footer-grip {
  width: 25px;
  height: 8px;
  background: repeating-linear-gradient(90deg, #3d4a5a 0, #3d4a5a 2px, transparent 2px, transparent 4px);
}

  </style>
</head>
<body>
  <div class="page-container">
    
    <!-- Left Column: Guestbook Form & Entries -->
    <main class="content-col">
      <header class="doc-header">
        <h1 class="page-title">:: guestbook ::</h1>
        <p class="subtitle">leave a note. entries are moderated; please be civil.</p>
      </header>

      <!-- Sign Form -->
      <section class="doc-section">
        <h2 class="section-heading"><span class="chevron">»</span> sign the book</h2>
        
        <form action="/guestbook.html" method="POST" class="sign-box">
          <div class="field-group">
            <label for="nickname" class="field-label">nickname</label>
            <input type="text" id="nickname" name="nickname" required maxlength="32" autocomplete="off" class="hud-input" />
          </div>

          <div class="field-group">
            <label for="message" class="field-label">message</label>
            <textarea id="message" name="message" required rows="4" maxlength="500" class="hud-textarea"></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="hud-submit-btn">post</button>
          </div>
        </form>
      </section>

      <!-- Entries Stream -->
      <section class="doc-section">
        <h2 class="section-heading"><span class="chevron">»</span> entries</h2>
        <div id="entries-stream" class="entries-stream">
          
        </div>
      </section>
    </main>

    <!-- Metallic Vertical Divider Seam -->
    <div class="metallic-spine"></div>

    <!-- Right Column: Sticky HUD Sidebar -->
    <aside class="sidebar-col">
      <div class="sticky-hud-frame">
        <div class="hud-top-row">
          <a href="index.html" class="title-badge" style="text-decoration: none; color: inherit;">skyfrei</a>
          <div class="hud-glyph">✱</div>
        </div>

        <nav class="hud-nav">
          <a href="about.html" class="hud-btn"><span>about</span><span class="arrow">&gt;</span></a>
          <a href="cv.html" class="hud-btn"><span>cv</span><span class="arrow">&gt;</span></a>
          <a href="journal.html" class="hud-btn"><span>journal</span><span class="arrow">&gt;</span></a>
          <a href="blog.html" class="hud-btn"><span>blog</span><span class="arrow">&gt;</span></a>
          <a href="guestbook.html" class="hud-btn active"><span>guestbook</span><span class="arrow">&gt;</span></a>
          <!--<a href="webring.html" class="hud-btn"><span>webring</span><span class="arrow">&gt;</span></a>-->
        </nav>

        <div class="sidebar-artbox">
          <div class="art-inner"></div>
        </div>
      </div>
    </aside>

  </div>

  <!-- Bottom Chassis Status Bar -->
  <footer class="hud-footer-bar">
    <div class="footer-dots">+++ //////</div>
    <div class="footer-info">
      https://skyfrei.dev // (c) 2026 skyfrei // email: k@skyfrei.dev
    </div>
    <div class="footer-grip"></div>
  </footer>
</body>
</html>
